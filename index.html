<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick Blaster</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0b1a; color: #e8e8ff;
    font-family: 'Press Start 2P', 'Courier New', monospace; overflow: hidden; }
  body { -webkit-user-select: none; -ms-user-select: none; user-select: none; }
  #screen { position: absolute; left: 50%; top: 50%; border-radius: 18px; overflow: hidden;
    box-shadow: 0 0 0 6px #1d1b33, 0 0 0 10px #3b2d6b, 0 0 60px rgba(255,79,216,.35); }
  #game { display: block; width: 100%; height: 100%; background: #000; cursor: none;
    -ms-touch-action: none; touch-action: none;
    image-rendering: -moz-crisp-edges; image-rendering: pixelated; -ms-interpolation-mode: nearest-neighbor; }
  #scan, #vignette { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
  #scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0, rgba(0,0,0,.28) 1px, transparent 1px, transparent 3px); }
  #vignette { background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.6)); }

  #help { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; padding: 0 16px; }
  #help .keys { font-size: 9px; opacity: .6; line-height: 2; }
  #fail { display: none; position: absolute; left: 0; right: 0; top: 40%; text-align: center;
    font-size: 12px; line-height: 2; padding: 0 16px; }

  .btn { font-family: inherit; font-size: 10px; line-height: 1.4; background: #ff4fd8; color: #10101a; border: 0;
    padding: 8px 12px; margin: 4px; cursor: pointer; box-shadow: 0 3px 0 #8a1f74; border-radius: 2px; }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { box-shadow: none; position: relative; top: 3px; }
  .btn.alt { background: #38bdf8; box-shadow: 0 3px 0 #1b6a8f; }
  .btn.dim { background: #2a2350; color: #e8e8ff; box-shadow: 0 3px 0 #15122b; }
  .btn.on { background: #ffd23f; box-shadow: 0 3px 0 #8a6a00; }
  .btn[disabled] { opacity: .35; cursor: default; filter: none; }
  .btn:focus { outline: 2px solid #fff; outline-offset: 2px; }

  /* Name entry: sits inside the game screen */
  #namePanel { display: none; position: absolute; left: 7%; right: 7%; top: 14%; z-index: 10; text-align: center;
    background: rgba(5,5,15,.95); border: 2px solid #3b2d6b; padding: 1.4em 1em 1.2em;
    box-shadow: 0 0 0 2px #1d1b33, 0 0 30px rgba(255,79,216,.35); }
  #namePanel .ptitle { color: #ffd23f; font-size: 1.3em; margin-bottom: .4em; text-shadow: .12em .12em 0 #7a3b00; }
  #namePanel .psub { color: #9aa0ff; font-size: .6em; margin-bottom: 1.2em; line-height: 1.8; }
  #nameInput { font-family: inherit; font-size: 1.3em; background: #000; color: #fff; border: 2px solid #ff4fd8;
    padding: .5em; width: 11em; max-width: 90%; text-align: center; text-transform: uppercase; outline: none;
    box-sizing: border-box; border-radius: 0; -webkit-user-select: text; -ms-user-select: text; user-select: text; }
  #nameErr { color: #ff4f6d; font-size: .6em; min-height: 1.2em; margin: .6em 0 .2em; }
  #namePanel .btn { font-size: .8em; }
  #chips { margin-top: .9em; }
  #chips .lbl { color: #9aa0ff; font-size: .55em; margin-bottom: .3em; }
  #chips .btn { font-size: .55em; padding: .6em .8em; }

  /* Score log: full-window overlay so it stays readable on small screens */
  #logPanel { display: none; position: fixed; top: 16px; bottom: 16px; left: 16px; right: 16px; max-width: 760px;
    margin: 0 auto; z-index: 50; background: #07071a; border: 2px solid #3b2d6b; font-size: 11px;
    box-shadow: 0 0 0 4px #1d1b33, 0 0 60px rgba(255,79,216,.35); }
  #logHead { position: absolute; top: 0; left: 0; right: 0; padding: 14px 14px 0; text-align: center; }
  #logHead .ptitle { color: #ffd23f; font-size: 18px; margin-bottom: 10px; text-shadow: 2px 2px 0 #7a3b00; }
  #logSummary { color: #9aa0ff; font-size: 10px; line-height: 1.8; margin: 6px 0 2px; }
  #logWrap { position: absolute; left: 14px; right: 14px; top: 132px; bottom: 64px; overflow: auto;
    -ms-touch-action: pan-y; touch-action: pan-y; -webkit-overflow-scrolling: touch; border-top: 2px solid #3b2d6b; }
  #logTable { width: 100%; border-collapse: collapse; font-size: 10px; }
  #logTable th { color: #9aa0ff; text-align: left; padding: 8px 6px; position: sticky; top: 0; background: #07071a; }
  #logTable td { padding: 7px 6px; border-bottom: 1px solid #1d1b33; }
  #logTable td.num, #logTable th.num { text-align: right; }
  #logTable tr.me td { color: #ffd23f; }
  #logTable tr.new td { background: rgba(255,79,216,.18); }
  #logEmpty { color: #9aa0ff; text-align: center; padding: 30px 10px; line-height: 2; font-size: 10px; }
  #logFoot { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; }
  #logNote { color: #666688; font-size: 8px; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="screen">
  <canvas id="game" width="320" height="240"></canvas>
  <div id="scan"></div><div id="vignette"></div>
  <div id="namePanel">
    <div class="ptitle">ENTER YOUR NAME</div>
    <div class="psub">EVERY SCORE IS SAVED TO THE LOG</div>
    <input id="nameInput" type="text" maxlength="10" autocomplete="off" spellcheck="false" placeholder="PLAYER">
    <div id="nameErr"></div>
    <button class="btn" id="nameGo" type="button">LET'S PLAY</button>
    <div id="chips"></div>
  </div>
</div>

<div id="help">
  <button class="btn alt" id="logBtn" type="button">SCORE LOG [L]</button>
  <button class="btn dim" id="playerBtn" type="button">CHANGE PLAYER [N]</button>
  <div class="keys">ARROWS / A D / MOUSE / TOUCH: MOVE &nbsp;&middot;&nbsp; SPACE / CLICK: LAUNCH &nbsp;&middot;&nbsp; P: PAUSE &nbsp;&middot;&nbsp; M: MUTE</div>
</div>

<div id="logPanel" role="dialog" aria-label="Score log">
  <div id="logHead">
    <div class="ptitle">SCORE LOG</div>
    <button class="btn dim" id="tabRecent" type="button">RECENT</button>
    <button class="btn dim" id="tabBest" type="button">TOP SCORES</button>
    <button class="btn dim" id="tabMine" type="button">MY GAMES</button>
    <div id="logSummary"></div>
  </div>
  <div id="logWrap">
    <table id="logTable"><thead><tr>
      <th class="num">#</th><th>PLAYER</th><th class="num">SCORE</th><th class="num">LEVEL</th><th class="num">TARGET</th><th>DATE</th>
    </tr></thead><tbody id="logBody"></tbody></table>
    <div id="logEmpty"></div>
  </div>
  <div id="logFoot">
    <div id="logNote"></div>
    <button class="btn alt" id="csvBtn" type="button">DOWNLOAD CSV</button>
    <button class="btn dim" id="clearBtn" type="button">CLEAR LOG</button>
    <button class="btn" id="closeBtn" type="button">CLOSE [L]</button>
  </div>
</div>

<div id="fail">Sorry, this browser can't run the game.<br>Please open this file in Chrome, Edge or Firefox.</div>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  var cvs = $('game');
  var ctx = cvs.getContext ? cvs.getContext('2d') : null;
  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame;
  if (!ctx || !raf) {
    $('screen').style.display = 'none';
    $('help').style.display = 'none';
    $('fail').style.display = 'block';
    return;
  }

  var W = 320, H = 240;
  ctx.imageSmoothingEnabled = false;

  /* ---------- Fit the 4:3 screen to the window ---------- */
  var screenEl = $('screen');
  function fit() {
    var maxW = Math.min(960, window.innerWidth - 40);
    var maxH = window.innerHeight - 120;
    var w = Math.max(200, Math.min(maxW, maxH * 4 / 3));
    var h = w * 3 / 4;
    screenEl.style.width = Math.round(w) + 'px';
    screenEl.style.height = Math.round(h) + 'px';
    screenEl.style.marginLeft = Math.round(-w / 2) + 'px';
    screenEl.style.marginTop = Math.round(-h / 2 - 40) + 'px';
    screenEl.style.fontSize = Math.max(8, Math.round(w / 52)) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  var FONT = '"Press Start 2P", "Courier New", monospace';
  var PAL = ['#ff4f6d', '#ff9f43', '#4ade80', '#38bdf8', '#a78bfa', '#ff4fd8', '#2dd4bf'];
  var TOP = 18, BW = 28, BH = 10, GAP = 2, BX = 11, BY = 30, MAXSP = 280;
  var LEVELS = [
    ['1111111111', '1111111111', '1111111111', '1111111111'],
    ['2222222222', '1.1.1.1.1.', '1111111111', '.1.1.1.1.1', '2222222222'],
    ['....33....', '...2222...', '..111111..', '.22222222.', '1111111111', '..111111..'],
    ['3.3.3.3.3.', '2222222222', '.2.2.2.2.2', '1111111111', '1.1.1.1.1.', '1111111111'],
    ['1111111111', '1........1', '1.333333.1', '1.2....2.1', '1.222222.1', '1........1', '1111111111']
  ];
  var DROPS = [
    { t: 'W', c: '#38bdf8' }, // wide paddle
    { t: 'M', c: '#4ade80' }, // multi-ball
    { t: 'S', c: '#ff9f43' }, // slow-mo
    { t: '+', c: '#ff4f6d' }  // extra life
  ];

  /* ---------- Score targets: 100, 250, 500, 750, 1000, 1250 ... ---------- */
  function targetAt(i) { return i === 0 ? 100 : i === 1 ? 250 : 250 * i; }
  function tierOf(s) { var i = 0; while (targetAt(i) <= s) i++; return i; }      // targets reached
  function nextTarget(s) { return targetAt(tierOf(s)); }
  function prevTarget(s) { var i = tierOf(s); return i ? targetAt(i - 1) : 0; }  // highest target reached

  /* ---------- Storage: player name + score log ---------- */
  var LOG_KEY = 'brickblaster_log', NAME_KEY = 'brickblaster_name';
  var storageOK = (function () {
    try {
      if (!window.localStorage) return false;
      window.localStorage.setItem('__bb', '1'); window.localStorage.removeItem('__bb');
      return true;
    } catch (e) { return false; }
  })();
  function sGet(k) { if (!storageOK) return null; try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function sSet(k, v) { if (!storageOK) return; try { window.localStorage.setItem(k, v); } catch (e) {} }

  var scoreLog = (function () {
    try {
      var a = JSON.parse(sGet(LOG_KEY) || '[]');
      if (!(a instanceof Array)) return [];
      return a.filter(function (e) { return e && typeof e.s === 'number' && typeof e.n === 'string'; });
    } catch (e) { return []; }
  })();
  function saveLog() { sSet(LOG_KEY, JSON.stringify(scoreLog)); }

  var playerName = sGet(NAME_KEY) || '';
  function cleanName(v) {
    return String(v || '').toUpperCase().replace(/[^A-Z0-9 _.\-]/g, '')
      .replace(/^[^A-Z0-9]+/, '').replace(/\s+/g, ' ').replace(/\s+$/, '').slice(0, 10);
  }
  function bestFor(name) {
    var b = 0;
    scoreLog.forEach(function (e) { if (e.n === name && e.s > b) b = e.s; });
    return b;
  }
  function recordEntry() {
    var best = null;
    scoreLog.forEach(function (e) { if (!best || e.s > best.s) best = e; });
    return best;
  }

  /* ---------- Game state ---------- */
  var state = 'name', score = 0, hi = 0, lives = 3, level = 0;
  var bricks = [], balls = [], drops = [], parts = [], texts = [], stars = [];
  var paddle = { x: W / 2 - 18, w: 36, tw: 36, h: 6, y: H - 16 };
  var wideT = 0, slowT = 0, combo = 0, shake = 0, msgT = 0, t = 0, bonus = 0;
  var keys = {}, mouseX = null, muted = false;
  var tierHit = 0, almostTier = -1, banner = null;
  var lastGame = null; // summary of the game that just ended
  var rec = recordEntry(); hi = rec ? rec.s : 0;

  function pad6(n) { var s = String(n); while (s.length < 6) s = '0' + s; return s; }
  function len(x, y) { return Math.sqrt(x * x + y * y); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  for (var si = 0; si < 70; si++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 0.6 + 0.2, p: Math.random() * 6 });
  }

  /* ---------- Sound (tiny WebAudio chiptune blips; silent if unsupported) ---------- */
  var ac = null;
  function audio() {
    try {
      if (!ac) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ac = new AC();
      }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function beep(f, d, type, v, f2) {
    if (!ac || muted) return;
    d = d || 0.08; type = type || 'square'; v = v || 0.07;
    try {
      var o = ac.createOscillator(), g = ac.createGain(), now = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f, now);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + d);
      g.gain.setValueAtTime(v, now); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
      o.connect(g); g.connect(ac.destination); o.start(now); o.stop(now + d + 0.02);
    } catch (e) {}
  }
  function jingle(notes, step, type) {
    if (!ac || muted) return;
    step = step || 0.09; type = type || 'square';
    for (var i = 0; i < notes.length; i++) {
      try {
        var o = ac.createOscillator(), g = ac.createGain(), st = ac.currentTime + i * step;
        o.type = type; o.frequency.value = notes[i];
        g.gain.setValueAtTime(0.06, st); g.gain.exponentialRampToValueAtTime(0.0001, st + step * 0.95);
        o.connect(g); g.connect(ac.destination); o.start(st); o.stop(st + step);
      } catch (e) {}
    }
  }

  /* ---------- Game setup ---------- */
  function baseSpeed() { return Math.min(205, 125 + level * 10); }

  function buildLevel() {
    var L = LEVELS[level % LEVELS.length], extra = Math.floor(level / LEVELS.length);
    bricks = [];
    for (var r = 0; r < L.length; r++) {
      for (var col = 0; col < L[r].length; col++) {
        var c = L[r].charAt(col);
        if (c === '.') continue;
        var hp = Math.min(3, parseInt(c, 10) + extra);
        bricks.push({ x: BX + col * (BW + GAP), y: BY + r * (BH + GAP), hp: hp, max: hp, color: PAL[r % PAL.length], flash: 0 });
      }
    }
  }
  function serve() {
    balls = [{ x: paddle.x + paddle.w / 2, y: paddle.y - 3, vx: 0, vy: 0, r: 2, stuck: true, trail: [] }];
    combo = 0;
  }
  function launch() {
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (!b.stuck) continue;
      b.stuck = false;
      var a = Math.random() * 0.6 - 0.3, sp = baseSpeed();
      b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp;
      beep(660, 0.06);
    }
  }
  function startGame() {
    score = 0; lives = 3; level = 0;
    paddle.w = paddle.tw = 36; paddle.x = W / 2 - 18;
    wideT = slowT = 0; drops = []; parts = []; texts = [];
    tierHit = 0; almostTier = -1; banner = null; lastGame = null;
    buildLevel(); serve(); state = 'play';
    jingle([523, 659, 784, 1047], 0.08);
  }
  function endGame() {
    var prevBest = bestFor(playerName);
    var entry = { n: playerName, s: score, l: level + 1, g: prevTarget(score), d: new Date().getTime() };
    scoreLog.push(entry);
    saveLog();
    var rank = 1;
    scoreLog.forEach(function (e) { if (e.s > score) rank++; });
    lastGame = { entry: entry, pb: score > prevBest && score > 0, first: prevBest === 0, rank: rank, total: scoreLog.length };
    if (score > hi) hi = score;
    state = 'over'; msgT = 1;
    jingle([392, 330, 262, 196], 0.18, 'triangle');
  }
  function loseLife() {
    lives--; shake = 6; wideT = 0; slowT = 0; drops = [];
    beep(220, 0.45, 'sawtooth', 0.09, 50);
    burst(paddle.x + paddle.w / 2, paddle.y, '#ff4fd8', 30);
    if (lives <= 0) endGame();
    else serve();
  }

  /* ---------- Effects ---------- */
  function burst(x, y, c, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 20 + Math.random() * 80;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.5, c: c });
    }
  }
  function floatText(x, y, s, c, life) { texts.push({ x: x, y: y, s: s, c: c || '#ffd23f', life: life || 0.9 }); }
  function brickColor(k) { return k.hp >= 3 ? '#ffd23f' : k.hp === 2 ? '#b8bed6' : k.color; }
  function removeFrom(arr, item) { var i = arr.indexOf(item); if (i >= 0) arr.splice(i, 1); }
  function keepAlive(arr, test) { var out = []; for (var i = 0; i < arr.length; i++) if (test(arr[i])) out.push(arr[i]); return out; }

  // Celebrate each target reached and nudge the player when the next one is close.
  function checkTargets() {
    var tier = tierOf(score);
    if (tier > tierHit) {
      var hit = targetAt(tier - 1);
      tierHit = tier;
      texts = keepAlive(texts, function (q) { return !q.almost; }); // the banner replaces the "almost" hint
      banner ={ a: 'TARGET ' + hit + ' HIT!', b: 'NEXT TARGET: ' + targetAt(tier), t: 2.4 };
      for (var i = 0; i < 4; i++) burst(40 + Math.random() * 240, 60 + Math.random() * 100, PAL[(i * 2 + tier) % PAL.length], 22);
      jingle([784, 988, 1175, 1568, 1175, 1568], 0.07);
    }
    var nt = targetAt(tier), pt = tier ? targetAt(tier - 1) : 0;
    if (almostTier !== tier && score >= pt + 0.8 * (nt - pt)) {
      almostTier = tier;
      if (!banner) {
        floatText(W / 2, 150, 'ALMOST ' + nt + '! KEEP GOING!', '#ffd23f', 1.6);
        texts[texts.length - 1].almost = true;
      }
    }
  }

  /* ---------- Collisions ---------- */
  function hitBrick(k) {
    var col = brickColor(k);
    k.hp--; k.flash = 0.08; shake = Math.max(shake, 1.5);
    if (k.hp <= 0) {
      combo++;
      var pts = 10 * k.max * (level + 1) + (combo - 1) * 5;
      score += pts;
      floatText(k.x + BW / 2, k.y, '+' + pts);
      burst(k.x + BW / 2, k.y + BH / 2, col, 14);
      beep(500 + Math.min(combo, 14) * 55, 0.07);
      if (Math.random() < 0.14) {
        var r = Math.random();
        var d = r < 0.33 ? DROPS[0] : r < 0.66 ? DROPS[1] : r < 0.9 ? DROPS[2] : DROPS[3];
        drops.push({ x: k.x + BW / 2, y: k.y + BH / 2, t: d.t, c: d.c });
      }
      removeFrom(bricks, k);
    } else {
      score += 5;
      burst(k.x + BW / 2, k.y + BH / 2, '#ffffff', 5);
      beep(300, 0.05, 'triangle', 0.08);
    }
    if (score > hi) hi = score;
    checkTargets();
  }

  function stepBall(b, dt) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < b.r + 2) { b.x = b.r + 2; b.vx = Math.abs(b.vx); beep(220, 0.03); }
    if (b.x > W - 2 - b.r) { b.x = W - 2 - b.r; b.vx = -Math.abs(b.vx); beep(220, 0.03); }
    if (b.y < TOP + b.r) { b.y = TOP + b.r; b.vy = Math.abs(b.vy); beep(220, 0.03); }
    if (b.y > H + b.r) { b.dead = true; return true; }

    // Paddle: bounce angle depends on where the ball lands
    var p = paddle;
    if (b.vy > 0 && b.y + b.r >= p.y && b.y - b.r <= p.y + p.h && b.x + b.r >= p.x && b.x - b.r <= p.x + p.w) {
      var rel = clamp((b.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
      var a = rel * 1.05, sp = Math.min(MAXSP, len(b.vx, b.vy) * 1.015);
      b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp; b.y = p.y - b.r;
      combo = 0;
      beep(440 + rel * 80, 0.05);
      burst(b.x, p.y, '#ff4fd8', 4);
    }

    // Bricks
    for (var i = 0; i < bricks.length; i++) {
      var k = bricks[i];
      if (b.x + b.r < k.x || b.x - b.r > k.x + BW || b.y + b.r < k.y || b.y - b.r > k.y + BH) continue;
      var ox = Math.min(b.x + b.r - k.x, k.x + BW - (b.x - b.r));
      var oy = Math.min(b.y + b.r - k.y, k.y + BH - (b.y - b.r));
      if (ox < oy) {
        if (b.x < k.x + BW / 2) { b.vx = -Math.abs(b.vx); b.x = k.x - b.r; }
        else { b.vx = Math.abs(b.vx); b.x = k.x + BW + b.r; }
      } else {
        if (b.y < k.y + BH / 2) { b.vy = -Math.abs(b.vy); b.y = k.y - b.r; }
        else { b.vy = Math.abs(b.vy); b.y = k.y + BH + b.r; }
      }
      hitBrick(k);
      break;
    }
    return false;
  }

  function collect(d) {
    jingle([660, 880, 1175], 0.05);
    burst(d.x, d.y, d.c, 12);
    if (d.t === 'W') { wideT = 12; floatText(d.x, d.y - 8, 'WIDE!', d.c); }
    if (d.t === 'S') { slowT = 10; floatText(d.x, d.y - 8, 'SLOW-MO', d.c); }
    if (d.t === '+') { lives++; floatText(d.x, d.y - 8, '1UP!', d.c); }
    if (d.t === 'M') {
      floatText(d.x, d.y - 8, 'MULTI!', d.c);
      launch();
      var add = [], spreads = [-0.45, 0.45];

    paddle.w += (paddle.tw - paddle.w) * Math.min(1, dt * 10);

    audio();
    if (!k) return;
    var tag = e.target && e.target.tagName;
    if (tag === 'BUTTON' && k === 'action') return; // let Space/Enter press the focused button
    if (e.preventDefault) e.preventDefault();
    if (k === 'left' || k === 'right') { keys[k] = true; return; }
    if (e.repeat) return;
    if (k === 'action') action();
    if (k === 'pause') togglePause();
    if (k === 'mute') muted = !muted;
    if (k === 'log') openLog();
    if (k === 'player' && canChangePlayer()) openName();
  });
  document.addEventListener('keyup', function (e) {
    var k = keyOf(e);
    if (k === 'left' || k === 'right') keys[k] = false;
  });
  window.addEventListener('blur', function () { keys = {}; if (state === 'play') state = 'pause'; });

  function toGameX(clientX) {
    var r = cvs.getBoundingClientRect();
    return (clientX - r.left) / (r.right - r.left) * W;
  }
  cvs.addEventListener('mousemove', function (e) { mouseX = toGameX(e.clientX); });
  cvs.addEventListener('mousedown', function (e) { audio(); mouseX = toGameX(e.clientX); action(); });
  cvs.addEventListener('touchstart', function (e) {
    e.preventDefault(); audio(); mouseX = toGameX(e.touches[0].clientX); action();
  }, { passive: false });
  cvs.addEventListener('touchmove', function (e) {
    e.preventDefault(); mouseX = toGameX(e.touches[0].clientX);
  }, { passive: false });

  /* ---------- Main loop ---------- */
  var now = function () { return (window.performance && performance.now) ? performance.now() : new Date().getTime(); };
  var last = now();
  function frame() {
    var tNow = now();
    var dt = Math.min(0.033, Math.max(0, (tNow - last) / 1000));
    last = tNow;
    if (state !== 'pause') update(dt);
    draw();
    syncButtons();
    raf(frame);
  }
  openName(); // ask for the player's name first
  raf(frame);
})();
</script>
</body>
</html>
